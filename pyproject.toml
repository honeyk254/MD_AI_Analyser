[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-ai-platform"
version = "2.0.0"
description = "Phase 1: Structural Biology Analysis Infrastructure"
authors = [
    {name = "MD AI Analyzer Team"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "MDAnalysis>=2.6.0",
    "mdtraj>=1.9.9",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "kaleido>=0.2.1",
    "anthropic>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "isort>=5.12.0",
    "flake8>=6.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
