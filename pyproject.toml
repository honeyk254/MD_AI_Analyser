[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-ai-platform"
version = "2.0.0"
description = "Phase 1: Structural Biology Analysis Infrastructure"
authors = [
    {name = "MD AI Analyzer Team"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "MDAnalysis>=2.6.0",
    "mdtraj>=1.9.9",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "kaleido>=0.2.1",
    "anthropic>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "MDAnalysisTests>=2.6.0",
    "ruff>=0.4",
    "mypy>=1.8"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"] # FastAPI Depends() in parameter defaults is idiomatic

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
