name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Lint
      run: ruff check src tests run_demo.py
    - name: Type-check
      run: mypy src
    - name: Test (regression + contract + LLM-eval suites, coverage gate)
      run: pytest tests/ --cov=src/md_platform/domain --cov-fail-under=80
